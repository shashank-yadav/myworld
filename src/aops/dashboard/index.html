<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Operations</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --panel-2: #f1f1ee; --line: #e3e3de; --line-2: #d3d3cc;
  --text: #1c1c1a; --muted: #6b6b64; --faint: #9a9a92;
  --accent: #3b5bdb; --accent-soft: #e8ecfd;
  --ok: #2f7d4f; --ok-soft: #e6f3eb; --bad: #c0392b; --bad-soft: #fbe9e7;
  --warn: #b45309; --warn-soft: #fdf1e1; --run: #3b5bdb; --run-soft: #e8ecfd;
  --llm: #7c3aed; --tool: #0e7490; --mcp: #0369a1; --browser: #a16207; --terminal: #374151;
  --memory: #be185d; --subagent: #4d7c0f; --approval: #b45309;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110; --panel: #191918; --panel-2: #20201f; --line: #2a2a28; --line-2: #3a3a37;
    --text: #ececea; --muted: #a0a09a; --faint: #6f6f69;
    --accent: #8ea4ff; --accent-soft: #1f2540;
    --ok: #5cc98a; --ok-soft: #15291d; --bad: #ff7b6b; --bad-soft: #35191a;
    --warn: #f5a524; --warn-soft: #33250e; --run: #8ea4ff; --run-soft: #1f2540;
    --llm: #b794f6; --tool: #5ac8d8; --mcp: #6cb6f5; --browser: #e3b341; --terminal: #b8bcc4;
    --memory: #f47eb3; --subagent: #9fd356; --approval: #f5a524;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 20px;
  padding: 0 20px; height: 52px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
nav.tabs { display: flex; gap: 2px; }
nav.tabs a { padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; }
nav.tabs a.on { color: var(--text); background: var(--panel-2); }
nav.tabs a:hover { color: var(--text); }
.spacer { flex: 1; }
select, input[type=search] { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-2);
  border-radius: 6px; padding: 5px 8px; }
.live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.live.off i { background: var(--bad); }

main { padding: 20px; max-width: 1480px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.015em; font-weight: 650; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.kpi { background: var(--panel); padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.run-name { font-weight: 550; }
.run-sum { color: var(--muted); font-size: 13px; margin-top: 2px; }
.run-sum b { color: var(--text); font-weight: 550; }
.run-sum .bad { color: var(--bad); } .run-sum .warn { color: var(--warn); }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 550; padding: 1px 7px;
  border-radius: 999px; white-space: nowrap; line-height: 18px; }
.b-succeeded, .b-ok { background: var(--ok-soft); color: var(--ok); }
.b-failed, .b-error { background: var(--bad-soft); color: var(--bad); }
.b-unknown, .b-attention, .b-abandoned { background: var(--warn-soft); color: var(--warn); }
.b-running { background: var(--run-soft); color: var(--run); }
.b-blocked, .b-interrupted, .b-incomplete { background: var(--panel-2); color: var(--muted); }
.b-running::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* run detail */
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.crumbs a:hover { color: var(--text); }
.meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 6px 0 14px; }
.meta b { color: var(--text); font-weight: 500; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
  background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
.banner b { color: var(--text); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px; align-items: start; }
.trace { overflow: hidden; }
.trace-head, .node { display: grid; grid-template-columns: minmax(0, 1fr) 92px minmax(120px, 28%) 68px 64px; gap: 10px; align-items: center; }
.trace-head { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.node { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 38px; }
.node:hover { background: var(--panel-2); }
.node.sel { background: var(--accent-soft); }
.node .label { display: flex; align-items: center; gap: 7px; min-width: 0; }
.node .name { font-weight: 520; white-space: nowrap; }
.node .detail { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.node .num { text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kind { font: 600 10px/16px var(--mono); padding: 0 5px; border-radius: 4px; text-transform: uppercase; flex: none;
  border: 1px solid currentColor; opacity: .9; }
.k-llm { color: var(--llm); } .k-tool { color: var(--tool); } .k-mcp { color: var(--mcp); } .k-browser { color: var(--browser); }
.k-terminal { color: var(--terminal); } .k-memory { color: var(--memory); } .k-subagent { color: var(--subagent); }
.k-approval, .k-message, .k-agent { color: var(--approval); }
.chg { font-size: 11px; font-weight: 600; color: var(--accent); flex: none; }
.guide { flex: none; width: 14px; height: 38px; margin: -6px 0; border-left: 1px solid var(--line-2); }
.bar-track { position: relative; height: 8px; }
.bar { position: absolute; top: 0; height: 8px; border-radius: 2px; min-width: 2px; background: var(--faint); }
.bar.k-llm { background: var(--llm); } .bar.k-tool { background: var(--tool); } .bar.k-mcp { background: var(--mcp); }
.bar.k-browser { background: var(--browser); } .bar.k-terminal { background: var(--terminal); } .bar.k-memory { background: var(--memory); }
.bar.k-subagent { background: var(--subagent); } .bar.o-failed { background: var(--bad); }
.bar.o-unknown { background: repeating-linear-gradient(45deg, var(--warn) 0 4px, transparent 4px 7px); border: 1px solid var(--warn); }
.bar.o-running { opacity: .5; }

.inspector { position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow: auto; }
.inspector .hd { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.inspector .hd .t { font-weight: 600; font-size: 15px; word-break: break-word; margin-top: 4px; }
.inspector section { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.inspector section:last-child { border-bottom: 0; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
pre.json { margin: 0; padding: 10px; background: var(--panel-2); border-radius: 6px; font: 12px/1.5 var(--mono);
  white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
.reason { padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.reason.unknown { background: var(--warn-soft); color: var(--warn); }
.reason.failed { background: var(--bad-soft); color: var(--bad); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty code { font-family: var(--mono); background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }

/* changes */
.changes-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.ledger { padding: 16px 20px; }
.ledger .line { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; font-size: 17px; }
.ledger .line .n { font-weight: 650; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.ledger .line.bad { color: var(--bad); } .ledger .line.warn { color: var(--warn); }
.ledger hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.attention { padding: 16px 20px; }
.att { padding: 10px 0; border-bottom: 1px solid var(--line); }
.att:last-child { border-bottom: 0; }
.att .what { font-weight: 550; }
.att .why { color: var(--muted); font-size: 13px; }

/* costs */
.dims { display: flex; gap: 2px; background: var(--panel-2); padding: 3px; border-radius: 8px; width: fit-content; }
.dims button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.dims button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.share .track { width: 90px; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.share .fill { height: 100%; background: var(--accent); }

@media (max-width: 1000px) {
  .split, .changes-top { grid-template-columns: 1fr; }
  .inspector { position: static; max-height: none; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  header.top { gap: 10px; padding: 0 16px; overflow-x: auto; }
  main { padding: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trace-head, .node { grid-template-columns: minmax(0, 1fr) 84px 56px; }
  .trace-head > :nth-child(3), .node > :nth-child(3), .trace-head > :nth-child(5), .node > :nth-child(5) { display: none; }
  .hide-sm { display: none; }
  .brand span { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/runs"><i class="dot"></i><span>Agent Operations</span></a>
  <nav class="tabs">
    <a href="#/runs" data-tab="runs">Runs</a>
    <a href="#/changes" data-tab="changes">External changes</a>
    <a href="#/costs" data-tab="costs">Cost &amp; latency</a>
  </nav>
  <div class="spacer"></div>
  <select id="range" aria-label="Time range">
    <option value="today">Today</option>
    <option value="24h">Last 24 hours</option>
    <option value="7d">Last 7 days</option>
    <option value="30d">Last 30 days</option>
  </select>
  <div class="live" id="live"><i></i><span>live</span></div>
</header>
<main id="app"></main>

<script>
"use strict";
const $app = document.getElementById("app");
const $range = document.getElementById("range");
const state = { selected: null, dim: "model", q: "", problems: false, runCache: null };
try { $range.value = localStorage.getItem("aops.range") || "today"; } catch (_) {}

// ---- helpers --------------------------------------------------------------------------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => v == null ? "—" : v === 0 ? "$0" : v < 0.01 ? "<$0.01" : "$" + v.toFixed(2);
const money4 = (v) => v == null ? "—" : "$" + v.toFixed(v < 1 ? 4 : 2);
const num = (v) => v == null ? "—" : Intl.NumberFormat().format(v);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + "s")}`;
function dur(ms) {
  if (ms == null) return "—";
  if (ms < 1000) return Math.round(ms) + "ms";
  if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + "s";
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000);
  return m < 60 ? `${m}m ${s}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return new Date(ts * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
const clock = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "—";
function since() {
  const now = Date.now() / 1000, r = $range.value;
  if (r === "today") { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; }
  return now - { "24h": 86400, "7d": 7 * 86400, "30d": 30 * 86400 }[r];
}
const rangeLabel = () => $range.options[$range.selectedIndex].text;
async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error(`${res.status} ${path}`);
  return res.json();
}
const STATUS_TEXT = { ok: "ok", succeeded: "succeeded", failed: "failed", error: "error", unknown: "⚠ outcome unknown",
  attention: "⚠ needs attention", abandoned: "abandoned", running: "running", blocked: "blocked", interrupted: "interrupted" };
const badge = (s) => `<span class="badge b-${esc(s)}">${esc(STATUS_TEXT[s] || s)}</span>`;
const kindTag = (k) => `<span class="kind k-${esc(k)}">${esc(k === "terminal" ? "sh" : k)}</span>`;

function summaryLine(s) {
  const parts = [`<b>${plural(s.calls, "call")}</b>`, plural(s.changes, "external change")];
  if (s.failures) parts.push(`<span class="bad">${plural(s.failures, "failure")}</span>`);
  if (s.unknown) parts.push(`<span class="warn">⚠ ${s.unknown} unknown</span>`);
  for (const l of s.loops || []) parts.push(`<span class="warn">⟳ ${esc(l.name)} failed ${l.count}× in a row</span>`);
  parts.push(money(s.cost) + (s.unpriced_llm_calls ? "*" : ""));
  return parts.join(" · ");
}

function brief(span) {
  const a = span.attrs || {}, args = a.args || {};
  if (span.kind === "llm") {
    const u = span.usage || {};
    const inTok = (u.input || 0) + (u.cache_read || 0) + (u.cache_write || 0);
    return inTok || u.output ? `${num(inTok)} in · ${num(u.output)} out` : (a.model || "");
  }
  if (span.kind === "subagent") return a.child_goal || args.task || "";
  if (span.name === "tool_call" && args) {  // Hermes tool-search bridge: show the tool it was aiming for
    const c = Array.isArray(args.calls) && args.calls[0] ? args.calls[0] : args;
    if (c.name) return `→ ${c.name} ${JSON.stringify(c.arguments || c.args || {})}`;
  }
  if (typeof args === "object" && args) {
    const v = args.command || args.url || args.query || args.path || args.subject || args.title || args.to || args.action;
    if (v) return typeof v === "string" ? v : JSON.stringify(v);
    const first = Object.values(args)[0];
    if (first != null) return typeof first === "string" ? first : JSON.stringify(first);
  }
  return a.choice ? `choice: ${a.choice}` : (a.command || "");
}

// ---- views ----------------------------------------------------------------------------

async function viewRuns() {
  const [ov, data] = await Promise.all([
    api(`/api/overview?since=${since()}`),
    api(`/api/runs?since=${since()}&limit=300${state.q ? "&q=" + encodeURIComponent(state.q) : ""}${state.problems ? "&status=problems" : ""}`),
  ]);
  const rows = data.runs.map((r) => `
    <tr class="click" data-href="#/runs/${encodeURIComponent(r.run_id)}">
      <td>${badge(r.status)}</td>
      <td><div class="run-name">${esc(r.name)}</div><div class="run-sum">${summaryLine(r.summary)}</div></td>
      <td class="hide-sm"><div>${esc(r.agent)}</div><div class="faint">${esc(r.workflow || "")}</div></td>
      <td class="hide-sm">${esc(r.user || "—")}</td>
      <td class="num">${dur(r.summary.duration_ms)}</td>
      <td class="num">${ago(r.start)}</td>
    </tr>`).join("");
  $app.innerHTML = `
    ${kpis(ov)}
    <div class="toolbar">
      <input type="search" id="q" placeholder="Filter runs" value="${esc(state.q)}">
      <label><input type="checkbox" id="problems" ${state.problems ? "checked" : ""}> Failures and unknown outcomes only</label>
    </div>
    <div class="card">${data.runs.length ? `
      <table>
        <thead><tr><th style="width:1%">Status</th><th>Run</th><th class="hide-sm">Agent</th><th class="hide-sm">User</th>
          <th class="num">Duration</th><th class="num">Started</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : emptyState()}
    </div>`;
  const q = document.getElementById("q");
  q.oninput = debounce(() => { state.q = q.value; render(); }, 250);
  document.getElementById("problems").onchange = (e) => { state.problems = e.target.checked; render(); };
}

function kpis(ov) {
  return `<div class="kpis">
    <div class="kpi"><div class="v">${num(ov.runs)}</div><div class="l">runs · ${esc(rangeLabel().toLowerCase())}</div></div>
    <div class="kpi"><div class="v">${num(ov.calls)}</div><div class="l">LLM + tool calls</div></div>
    <div class="kpi"><div class="v">${num(ov.changes.changes)}</div><div class="l">external changes</div></div>
    <div class="kpi ${ov.failures ? "bad" : ""}"><div class="v">${num(ov.failures)}</div><div class="l">failed calls</div></div>
    <div class="kpi ${ov.unknown ? "warn" : ""}"><div class="v">${ov.unknown ? "⚠ " : ""}${num(ov.unknown)}</div><div class="l">outcomes unknown</div></div>
    <div class="kpi"><div class="v">${money(ov.cost)}</div><div class="l">model spend</div></div>
  </div>`;
}

function emptyState() {
  return `<div class="empty">
    <div style="font-weight:600;color:var(--text);margin-bottom:6px">No runs in this range</div>
    Connect an agent with <code>aops install hermes</code>, or load sample data with <code>aops demo</code>.
  </div>`;
}

async function viewRun(runId) {
  const run = await api(`/api/runs/${encodeURIComponent(runId)}`);
  state.runCache = run;
  const flat = [];
  (function walk(nodes, depth) { for (const n of nodes) { flat.push([n, depth]); walk(n.children || [], depth + 1); } })(run.roots, 0);
  const byId = Object.fromEntries(flat.map(([n]) => [n.span_id, n]));
  if (!state.selected || !byId[state.selected]) {
    const firstProblem = flat.find(([n]) => n.outcome === "unknown") || flat.find(([n]) => n.outcome === "failed");
    state.selected = (firstProblem || flat[0] || [{}])[0].span_id || null;
  }
  const t0 = run.start, t1 = Math.max(run.end || run.last_ts, ...flat.map(([n]) => n.end || n.start || t0));
  const total = Math.max(t1 - t0, 0.001);
  const s = run.summary;
  const unknown = flat.filter(([n]) => n.outcome === "unknown").map(([n]) => n);

  const nodes = flat.map(([n, d]) => {
    const left = ((n.start ?? t0) - t0) / total * 100;
    const width = n.end != null ? Math.max((n.end - n.start) / total * 100, 0.4) : Math.max(100 - left, 0.4);
    const chg = n.effect && n.effect.changes_world ? `<span class="chg" title="Changes the outside world">◆ ${esc(n.effect.effect)}</span>` : "";
    return `<div class="node ${n.span_id === state.selected ? "sel" : ""}" data-span="${esc(n.span_id)}">
      <div class="label">${"<i class='guide'></i>".repeat(d)}${kindTag(n.kind)}<span class="name">${esc(n.name)}</span>${chg}<span class="detail">${esc(brief(n))}</span></div>
      <div>${n.kind === "llm" && n.outcome === "succeeded" ? "" : badge(n.outcome)}</div>
      <div class="bar-track"><div class="bar k-${esc(n.kind)} o-${esc(n.outcome)}" style="left:${left}%;width:${Math.min(width, 100 - left)}%"></div></div>
      <div class="num">${n.point ? "" : dur(n.duration_ms)}</div>
      <div class="num">${n.cost != null ? money4(n.cost) : ""}</div>
    </div>`;
  }).join("");

  const children = (run.child_runs || []).map((c) =>
    `<a href="#/runs/${encodeURIComponent(c.run_id)}" class="badge b-blocked">↳ child run: ${esc(c.name)}</a>`).join(" ");
  const parent = run.parent_run_id ? ` / <a href="#/runs/${encodeURIComponent(run.parent_run_id)}">parent run</a>` : "";

  $app.innerHTML = `
    <div class="crumbs"><a href="#/runs">Runs</a>${parent} / <span class="mono">${esc(run.run_id)}</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>${esc(run.name)}</h1>${badge(run.status)}</div>
    <div class="run-sum" style="font-size:14px">${summaryLine(s)}</div>
    <div class="meta">
      <span>agent <b>${esc(run.agent)}</b></span>
      ${run.user ? `<span>user <b>${esc(run.user)}</b></span>` : ""}
      ${run.workflow ? `<span>workflow <b>${esc(run.workflow)}</b></span>` : ""}
      ${run.model ? `<span>model <b>${esc(run.model)}</b></span>` : ""}
      <span>started <b>${esc(new Date(run.start * 1000).toLocaleString())}</b></span>
      <span>duration <b>${dur(s.duration_ms)}</b></span>
      <span>tokens <b>${num(s.tokens.input + s.tokens.cache_read + s.tokens.cache_write)} in · ${num(s.tokens.output)} out</b></span>
      ${children}
    </div>
    ${unknown.length ? `<div class="banner">⚠<div><b>${plural(unknown.length, "action")} with unknown outcome.</b>
      ${unknown.map((n) => esc(n.name)).join(", ")} ended without a confirmed result, so the external side effect may have occurred.
      Check the target system before retrying, or you may create a duplicate.</div></div>` : ""}
    ${(s.loops || []).map((l) => `<div class="banner">⟳<div><b>Stuck in a loop: ${esc(l.name)} failed ${l.count} times in a row.</b>
      Last error: ${esc(l.error || "—")}</div></div>`).join("")}
    <div class="split">
      <div class="card trace">
        <div class="trace-head"><div>Step</div><div>Outcome</div><div>Timeline</div><div style="text-align:right">Time</div><div style="text-align:right">Cost</div></div>
        ${nodes || `<div class="empty">No steps recorded yet.</div>`}
      </div>
      <div class="card inspector" id="inspector">${inspector(byId[state.selected], run)}</div>
    </div>`;
  $app.querySelectorAll(".node").forEach((el) => el.onclick = () => {
    state.selected = el.dataset.span;
    $app.querySelectorAll(".node").forEach((x) => x.classList.toggle("sel", x === el));
    document.getElementById("inspector").innerHTML = inspector(byId[state.selected], run);
  });
}

function jsonBlock(v) {
  if (v == null || v === "") return "";
  let text = v;
  if (typeof v === "string") { try { const p = JSON.parse(v); if (p && typeof p === "object") text = JSON.stringify(p, null, 2); } catch (_) {} }
  else text = JSON.stringify(v, null, 2);
  return `<pre class="json">${esc(text)}</pre>`;
}

function inspector(n, run) {
  if (!n) return `<div class="empty">Select a step to inspect it.</div>`;
  const a = n.attrs || {}, e = n.effect || {};
  const input = a.args ?? a.request ?? a.command ?? a.child_goal;
  const output = a.result ?? a.response ?? a.assistant_message ?? a.child_summary;
  const reason = n.outcome_reason ? `<div class="reason ${esc(n.outcome)}">${esc(n.outcome_reason)}</div>` : "";
  const u = n.usage || {};
  const skip = new Set(["args", "request", "result", "response", "assistant_message", "child_summary", "child_goal", "usage", "status", "error"]);
  const rest = Object.fromEntries(Object.entries(a).filter(([k]) => !skip.has(k)));
  return `
    <div class="hd">${kindTag(n.kind)} ${badge(n.outcome)}<div class="t">${esc(n.name)}</div></div>
    ${reason ? `<section>${reason}</section>` : ""}
    <section><dl class="kv">
      <dt>Effect</dt><dd>${esc(e.effect || "—")}${e.changes_world ? " · <b>changes external state</b>" : ""}</dd>
      <dt>System</dt><dd>${esc(e.system || "—")}${e.object ? " · " + esc(e.object) : ""}</dd>
      <dt>Started</dt><dd>${clock(n.start)} <span class="faint">+${dur(((n.start || run.start) - run.start) * 1000)}</span></dd>
      <dt>Latency</dt><dd>${n.point ? "—" : dur(n.duration_ms)}</dd>
      ${n.model ? `<dt>Model</dt><dd>${esc(a.response_model || n.model)}</dd>` : ""}
      ${n.kind === "llm" ? `<dt>Tokens</dt><dd>${num(u.input)} in · ${num(u.cache_read)} cached · ${num(u.cache_write)} cache write · ${num(u.output)} out</dd>
        <dt>Cost</dt><dd>${n.cost == null ? "unpriced (add the model to ~/.aops/pricing.json)" : money4(n.cost)}</dd>` : ""}
      ${n.status ? `<dt>Status</dt><dd>${esc(n.status)}</dd>` : ""}
    </dl></section>
    ${n.error ? `<section><h2>Error</h2>${jsonBlock(n.error)}</section>` : ""}
    ${input != null ? `<section><h2>Input</h2>${jsonBlock(input)}</section>` : ""}
    ${output != null ? `<section><h2>Output</h2>${jsonBlock(output)}</section>` : ""}
    <section><details><summary>All attributes · span ${esc(n.span_id)}</summary>${jsonBlock(rest)}</details></section>`;
}

async function viewChanges() {
  const f = await api(`/api/changes?since=${since()}`);
  const t = f.totals;
  const lines = f.groups.filter((g) => g.succeeded > 0).map((g) =>
    `<div class="line"><span class="n">${g.succeeded}</span><span>${esc(g.label.replace(/^\d+ /, ""))}</span></div>`).join("");
  const failed = f.items.filter((i) => i.outcome === "failed");
  const unknown = f.items.filter((i) => i.outcome === "unknown");
  const inflight = f.items.filter((i) => i.outcome === "running");
  const att = (i) => `<div class="att"><div class="what"><a href="#/runs/${encodeURIComponent(i.run_id)}">${esc(i.name)}</a> ${badge(i.outcome)}</div>
    <div class="why">${esc(i.outcome_reason || "")}</div>
    <div class="faint" style="font-size:12px">${esc(i.run_name)} · ${esc(i.agent)} · ${ago(i.start)}</div></div>`;

  const rows = f.items.map((i) => `
    <tr class="click" data-href="#/runs/${encodeURIComponent(i.run_id)}">
      <td class="num" style="text-align:left">${clock(i.start)}</td>
      <td>${badge(i.outcome)}</td>
      <td><div>${esc(i.effect.label)}</div><div class="faint mono">${esc(i.name)}</div></td>
      <td class="hide-sm">${esc(i.effect.system)}</td>
      <td class="hide-sm mono" style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(brief(i))}</td>
      <td class="hide-sm">${esc(i.run_name)}</td>
    </tr>`).join("");

  $app.innerHTML = `
    <h1>External changes</h1>
    <div class="muted" style="margin-bottom:16px">Everything your agents did that changed the world outside them · ${esc(rangeLabel().toLowerCase())}</div>
    <div class="changes-top">
      <div class="card ledger">
        <h2>${esc(rangeLabel())}</h2>
        ${lines || `<div class="muted">No completed external changes.</div>`}
        ${(t.failed || t.unknown || t.running) ? "<hr>" : ""}
        ${t.failed ? `<div class="line bad"><span class="n">${t.failed}</span><span>${t.failed === 1 ? "action" : "actions"} failed</span></div>` : ""}
        ${t.unknown ? `<div class="line warn"><span class="n">${t.unknown}</span><span>${t.unknown === 1 ? "action outcome" : "action outcomes"} unknown ⚠</span></div>` : ""}
        ${t.running ? `<div class="line"><span class="n">${t.running}</span><span>in flight</span></div>` : ""}
      </div>
      <div class="card attention">
        <h2>Needs attention</h2>
        ${unknown.length || failed.length || inflight.length ? [...unknown, ...inflight, ...failed].map(att).join("") :
          `<div class="muted">Nothing to review. Every external action has a confirmed result.</div>`}
      </div>
    </div>
    <div class="card">${f.items.length ? `<table>
      <thead><tr><th>Time</th><th>Outcome</th><th>Change</th><th class="hide-sm">System</th><th class="hide-sm">Target</th><th class="hide-sm">Run</th></tr></thead>
      <tbody>${rows}</tbody></table>` : emptyState()}</div>`;
}

const DIMS = [["model", "Model"], ["agent", "Agent"], ["tool", "Tool"], ["mcp", "MCP server"], ["workflow", "Workflow"], ["user", "User"]];
async function viewCosts() {
  const d = await api(`/api/breakdown?by=${state.dim}&since=${since()}`);
  const maxCost = Math.max(...d.rows.map((r) => r.cost), 0) || 1;
  const maxMs = Math.max(...d.rows.map((r) => r.total_ms), 0) || 1;
  const totalCost = d.rows.reduce((s, r) => s + r.cost, 0);
  const rows = d.rows.map((r) => `<tr>
    <td class="mono">${esc(r.key)}</td>
    <td class="num">${num(r.runs)}</td>
    <td class="num">${num(r.calls)}</td>
    <td class="num">${r.errors ? `<span style="color:var(--bad)">${(r.errors / r.calls * 100).toFixed(0)}%</span>` : "0%"}</td>
    <td class="num hide-sm">${r.input_tokens || r.output_tokens ? `${num(r.input_tokens)} / ${num(r.output_tokens)}` : "—"}</td>
    <td class="num">${dur(r.p50_ms)}</td>
    <td class="num">${dur(r.p95_ms)}</td>
    <td class="num hide-sm"><div class="share"><span>${dur(r.total_ms)}</span><span class="track"><span class="fill" style="display:block;width:${r.total_ms / maxMs * 100}%;background:var(--faint)"></span></span></div></td>
    <td class="num"><div class="share"><span>${money4(r.cost)}</span><span class="track hide-sm"><span class="fill" style="display:block;width:${r.cost / maxCost * 100}%"></span></span></div></td>
  </tr>`).join("");
  $app.innerHTML = `
    <h1>Cost &amp; latency</h1>
    <div class="muted" style="margin-bottom:16px">${money(totalCost)} model spend · ${esc(rangeLabel().toLowerCase())}</div>
    <div class="toolbar"><div class="dims">${DIMS.map(([k, l]) => `<button data-dim="${k}" class="${k === state.dim ? "on" : ""}">${l}</button>`).join("")}</div></div>
    <div class="card">${d.rows.length ? `<table>
      <thead><tr><th>${esc(DIMS.find(([k]) => k === state.dim)[1])}</th><th class="num">Runs</th><th class="num">Calls</th><th class="num">Errors</th>
        <th class="num hide-sm">Tokens in / out</th><th class="num">p50</th><th class="num">p95</th><th class="num hide-sm">Total time</th><th class="num">Cost</th></tr></thead>
      <tbody>${rows}</tbody></table>` : emptyState()}</div>`;
  $app.querySelectorAll("[data-dim]").forEach((b) => b.onclick = () => { state.dim = b.dataset.dim; render(); });
}

// ---- router ---------------------------------------------------------------------------
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

let rendering = false;
async function render() {
  if (rendering) return;
  rendering = true;
  const hash = location.hash || "#/runs";
  const [, tab, id] = hash.split("/");
  document.querySelectorAll("nav.tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === tab));
  const focused = document.activeElement && document.activeElement.id;
  const scroll = window.scrollY;
  try {
    if (tab === "runs" && id) await viewRun(decodeURIComponent(id));
    else if (tab === "changes") await viewChanges();
    else if (tab === "costs") await viewCosts();
    else await viewRuns();
    document.getElementById("live").classList.remove("off");
  } catch (err) {
    document.getElementById("live").classList.add("off");
    $app.innerHTML = `<div class="empty">Can't reach the collector (${esc(err.message)}). Is <code>aops serve</code> running?</div>`;
  } finally {
    rendering = false;
    if (focused) { const el = document.getElementById(focused); if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } }
    window.scrollTo(0, scroll);
  }
}

$app.addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-href]");
  if (tr && !e.target.closest("a")) location.hash = tr.dataset.href;
});
window.addEventListener("hashchange", () => { state.selected = null; window.scrollTo(0, 0); render(); });
$range.onchange = () => { try { localStorage.setItem("aops.range", $range.value); } catch (_) {} render(); };
setInterval(() => {
  if (document.hidden || window.getSelection().toString()) return;
  const onRun = /^#\/runs\/./.test(location.hash);
  if (onRun && state.runCache && state.runCache.status !== "running") return;  // finished runs don't change
  render();
}, 4000);
render();
</script>
</body>
