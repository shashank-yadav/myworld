name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uvx ruff check src tests
      - run: uv run pytest -q
      - name: released tool versions still match their freeze
        run: uv run toolsim versions | tee /dev/stderr | grep -qv "✗"
      - run: uv build
