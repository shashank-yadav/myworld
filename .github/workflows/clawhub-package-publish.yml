name: ClawHub Package Publish

on:
  pull_request:
    paths:
      - "packaging/clawhub/openclaw-myworld/**"
      - ".github/workflows/clawhub-package-publish.yml"
  workflow_dispatch:
  push:
    tags:
      - "clawhub-openclaw-myworld-v*"

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      source_path: packaging/clawhub/openclaw-myworld
      family: code-plugin
      dry_run: true

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.12.0
    with:
      source_path: packaging/clawhub/openclaw-myworld
      family: code-plugin
      dry_run: false
      wait_for_publication: true
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
