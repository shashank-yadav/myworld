[project]
name = "agent-operations"
version = "0.1.0"
description = "Observability for autonomous agents: see everything your agents do, especially what they change in the real world"
readme = "README.md"
requires-python = ">=3.11"
# The core (SDK + Hermes plugin) is stdlib-only so it can be installed into any agent runtime's venv.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
aops = "aops.cli:main"

[project.entry-points."hermes_agent.plugins"]
aops = "aops.integrations.hermes:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: end-to-end tests against a real agent runtime (opt in with AOPS_LIVE=1)"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "agent-operations[server]",
    "httpx>=0.27",
    "pytest>=8",
]

[tool.uv.build-backend]
module-name = "aops"
