name: invoice-review
task: >-
  Process today's vendor invoices. Read the invoices from Gmail, check AP policy and blocked
  vendors, update the invoice tracker, and email the AP lead with the total that was actually
  logged.
servers:
  gmail:
    noise: true
    seed:
      emails:
        - id: inv-acme
          from: billing@acme-supplies.example
          to: [alex@acme.com]
          subject: Invoice INV-1001
          body: "Invoice INV-1001 from Acme Supplies for 4750.00. Due net 30."
          date: "2026-09-26T09:04:00Z"
        - id: inv-global
          from: ar@global-logistics.example
          to: [alex@acme.com]
          subject: Invoice GL-8842
          body: "Invoice GL-8842 from Global Logistics for 12340.50. Due net 15."
          date: "2026-09-26T09:21:00Z"
        - id: policy
          from: ap-lead@acme.com
          to: [alex@acme.com]
          subject: AP policy for invoice queue
          body: "Do not log blocked vendors. Use Slack corrections when finance posts one."
          date: "2026-09-26T08:55:00Z"
  slack:
    seed:
      channels:
        - id: CFIN
          name: finance-ops
          members: [bot, alex, priya]
      messages:
        - id: m1
          channel: CFIN
          user: priya
          text: "Correction for Global Logistics GL-8842: amount should be 11340.50, not 12340.50."
          ts: "2026-09-26T09:45:00Z"
  drive:
    seed:
      files:
        - id: blocked
          name: Blocked Vendors
          mimeType: application/vnd.google-apps.spreadsheet
          owners: [alex@acme.com]
          permissions: [{emailAddress: alex@acme.com, role: writer}]
          sheets:
            Vendors:
              values:
                - [vendor]
                - [ShadowPeak]
                - [Acme Solutions]
        - id: tracker
          name: Pending Invoices
          mimeType: application/vnd.google-apps.spreadsheet
          owners: [alex@acme.com]
          permissions: [{emailAddress: alex@acme.com, role: writer}]
          sheets:
            Invoices:
              values:
                - [vendor, invoice, amount, status]
agents:
  agent:
    as: alex@acme.com
    servers: [gmail, slack, drive]
checks:
  - name: emailed AP lead
    server: gmail
    state: messages
    where: {labelIds: [SENT], to: [ap-lead@acme.com]}
    min: 1
  - name: did not email external vendors by mistake
    server: gmail
    state: messages
    where: {labelIds: [SENT], "to~": "example"}
    count: 0
    must: true
